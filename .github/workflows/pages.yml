name: Deploy LabsBuddy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p dist/data dist/vendor
          cp index.html matrix.html app.js sw.js manifest.webmanifest icon.svg dist/
          cp data/cameras.json data/recording-matrix.json dist/data/
          if [ -f vendor/qrcode.min.js ]; then
            cp vendor/qrcode.min.js dist/vendor/
          else
            echo "QR library not yet bundled; deploying alpha shell"
            printf '%s\n' '/* QR engine pending; alpha shell only */' > dist/vendor/qrcode.min.js
          fi
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
